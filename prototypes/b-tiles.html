<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ccsmoni タイル</title>
<script>
  // ?theme=dark|light を最初に反映（ちらつき防止）
  (function () { var t = new URLSearchParams(location.search).get("theme"); if (t) document.documentElement.dataset.theme = t; })();
</script>
<link rel="stylesheet" href="b-tiles.css">
</head>
<body>
<div class="app" id="app">
  <header class="bar">
    <div class="brand">
      <span class="brand-mark"><svg viewBox="0 0 16 16"><path d="M2 12l4-4 3 3 5-6"/></svg></span>
      ccsmoni
    </div>
    <nav class="nav"><a href="#" aria-current="page">推移</a><a href="#">設定</a></nav>
    <span class="sep"></span>
    <div class="summary" id="summary"></div>
    <span class="grow"></span>
    <div class="fresh" id="fresh"></div>
    <div class="ctrls">
      <div class="seg" id="range" role="group" aria-label="期間">
        <button data-v="24h">24時間</button><button data-v="7d">7日</button><button data-v="30d">30日</button>
      </div>
      <div class="seg" id="view" role="group" aria-label="表示">
        <button data-v="tiles" title="アカウントごとに並べる">並べる</button><button data-v="overlay" title="1つのグラフに重ねて比べる">重ねる</button>
      </div>
      <button class="btn" id="refresh"><svg class="i" viewBox="0 0 16 16"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5v3h-3"/></svg><span class="lbl">今すぐ更新</span></button>
      <button class="icon-btn" id="theme" title="ライト／ダーク"><svg class="i" viewBox="0 0 16 16"><path d="M13 9.5A5.5 5.5 0 0 1 6.5 3a5.5 5.5 0 1 0 6.5 6.5z"/></svg></button>
    </div>
  </header>

  <main class="main">
    <div class="grid" id="grid"></div>
    <section class="tile big" id="big">
      <div class="t-head">
        <h3>比較</h3>
        <div class="seg" id="bigKind"><button data-v="weekly_all">週間</button><button data-v="session">5h</button></div>
        <span class="note">上の数字の帯を押すと表示／非表示。ダブルクリックでそれだけ表示</span>
      </div>
      <div class="t-chart"><canvas class="base"></canvas><canvas class="ovl"></canvas></div>
    </section>
  </main>

  <footer class="foot" id="foot">
    <span class="key"><svg viewBox="0 0 22 12"><path d="M1 9 L8 6 L14 6 L21 2" stroke="var(--ink-2)" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="8" cy="6" r="2" fill="var(--ink-2)" stroke="var(--surface)" stroke-width="1.2"/></svg>週間（点＝値が変わった取得）</span>
    <span class="key"><svg viewBox="0 0 22 12"><path d="M1 11 L6 5 L12 8 L21 3 L21 11 Z" fill="var(--ink-2)" fill-opacity=".18"/><path d="M1 11 L6 5 L12 8 L21 3" stroke="var(--ink-2)" stroke-opacity=".5" fill="none"/></svg>5時間枠</span>
    <span class="key"><svg viewBox="0 0 22 12"><path d="M11 0 V12" stroke="var(--ink-3)" stroke-width="1"/></svg>週間リセット</span>
    <span class="key"><svg viewBox="0 0 22 12"><path d="M7 8 V12 M15 8 V12" stroke="var(--ink-3)" stroke-width="1"/></svg>5h リセット</span>
    <span class="key"><svg viewBox="0 0 22 12"><defs><pattern id="hk" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0 V4" stroke="var(--ink-3)" stroke-opacity=".5"/></pattern></defs><rect x="1" y="0" width="20" height="12" fill="url(#hk)"/></svg>取得できなかった区間</span>
    <span class="key"><svg viewBox="0 0 22 12"><rect x="1" y="9" width="20" height="3" rx="1" fill="var(--st-crit)"/></svg>取得エラー・ログイン切れ</span>
    <span class="key"><svg viewBox="0 0 22 12"><rect x="1" y="4" width="20" height="5" rx="2.5" fill="var(--track)"/><rect x="1" y="4" width="11" height="5" rx="2.5" fill="var(--meter)"/><rect x="14" y="1" width="2" height="11" rx="1" fill="var(--ink)"/></svg>目盛り＝均等に使った場合の位置</span>
    <span class="cand" id="cand"></span>
  </footer>
</div>
<div class="ttip" id="tip" role="status" aria-live="polite"></div>

<script src="demo-data.js"></script>
<script src="b-tiles.js"></script>
</body>
</html>
