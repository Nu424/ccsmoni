<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ccsmoni Cockpit</title>
<script>
  // ?theme=dark|light で表示を固定する（無ければ OS の設定に従う）
  (function () {
    var t = new URLSearchParams(location.search).get("theme");
    if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<link rel="stylesheet" href="a-matrix.css">
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><rect x="0.5" y="0.5" width="17" height="17" rx="4.5" fill="none" stroke="currentColor" stroke-opacity=".25"/><path d="M3.5 12.5 7 8.5l2.5 2.5 5-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      ccsmoni
    </div>
    <nav class="nav"><a href="#" aria-current="page">ダッシュボード</a><a href="#">設定</a></nav>
    <div class="sum" id="sum"></div>
    <div class="spacer"></div>
    <div class="fresh" id="fresh"></div>
    <button class="btn primary" id="refreshAll" type="button"></button>
    <button class="btn icon" id="themeBtn" type="button" title="テーマを切り替える" aria-label="テーマを切り替える"></button>
  </header>

  <main class="app">
    <section class="panel matrix" aria-label="アカウント">
      <div class="grid-row mhead" role="row">
        <span></span>
        <span>アカウント</span>
        <span>5時間枠 <span class="sub">｜ ペース目盛り</span></span>
        <span>週間枠 <span class="sub">｜ ペース目盛り</span></span>
        <span>今週の枠 <span class="sub">開始 → リセット ・ 線=週間 面=5h</span></span>
        <span class="peaks-h"><span>週ピーク</span><span class="sub">6週 → 今週</span></span>
        <span>ヒント・状態</span>
        <span></span>
      </div>
      <div id="rows"></div>
    </section>

    <section class="panel chartp" aria-label="推移">
      <div class="phead">
        <h2>推移</h2>
        <span class="desc" id="chartDesc">週間枠の使用率 ・ 下段は 5時間枠</span>
        <div class="seg" id="rangeSeg" role="group" aria-label="期間">
          <button type="button" data-r="24h">24h</button>
          <button type="button" data-r="7d" aria-pressed="true">7日</button>
          <button type="button" data-r="30d">30日</button>
        </div>
        <div class="seg" id="laneSeg" role="group" aria-label="5時間枠の表示">
          <button type="button" data-l="1" aria-pressed="true">5h レーン</button>
          <button type="button" data-l="0">隠す</button>
        </div>
        <div class="spacer"></div>
        <div class="keys" id="keys"></div>
      </div>
      <div class="chartwrap" id="chartwrap"><svg id="chart" role="img" aria-label="アカウントごとの使用率の推移"></svg></div>
    </section>
  </main>
</div>
<div class="tip" id="tip" hidden></div>
<div class="pop" id="pop" hidden></div>
<script src="demo-data.js"></script>
<script src="a-matrix.js"></script>
</body>
</html>
