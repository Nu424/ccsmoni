[project]
name = "ccsmoni"
version = "0.1.0"
description = "Claude Code s monitor — 複数アカウントの利用状況を記録・可視化する"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "tomlkit>=0.13",
    "pydantic>=2.9",
    "tzdata>=2024.1",
]

[project.scripts]
ccsmoni = "ccsmoni.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ccsmoni"]

[tool.pytest.ini_options]
testpaths = ["tests"]
